name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runbox
          POSTGRES_PASSWORD: runbox
          POSTGRES_DB: runbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runbox"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build sandbox image
        run: docker build -t runbox/python:3.13 sandbox-images/python
      - name: Integration + adversarial tests
        env:
          RUNBOX_TEST_DATABASE_URL: postgres://runbox:runbox@localhost:5432/runbox?sslmode=disable
        run: go test -race -tags integration -count=1 -v ./internal/integration/

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build --target api -t runbox-api .
          docker build --target worker -t runbox-worker .
